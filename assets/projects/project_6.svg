<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 338" width="600" height="338">
  <!-- Background Layer -->
  <rect width="600" height="338" fill="#4c1d95"/>
  <rect width="600" height="338" fill="#8b5cf6" fill-opacity="0.85"/>

  <!-- Tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="84" x2="600" y2="84"/>
    <line x1="0" y1="169" x2="600" y2="169"/>
    <line x1="0" y1="253" x2="600" y2="253"/>
    <line x1="150" y1="0" x2="150" y2="338"/>
    <line x1="300" y1="0" x2="300" y2="338"/>
    <line x1="450" y1="0" x2="450" y2="338"/>
  </g>

  <!-- Central Vector Graphic -->
  <g>
    <rect x="270" y="95" width="60" height="60" rx="6" fill="none" stroke="#ffffff" stroke-width="3"/><polyline points="280,125 295,140 320,110" fill="none" stroke="#8b5cf6" stroke-width="4"/>
  </g>

  <!-- Badge Tag -->
  <rect x="120" y="210" width="360" height="32" rx="16" fill="#07192f" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="300" y="231" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="1">Tkinter GUI • Timestamp Engine</text>

  <!-- Title Text -->
  <text x="300" y="275" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.5">PYTHON DESKTOP TASK COMMANDER</text>
  <text x="300" y="302" font-size="11" font-weight="bold" fill="rgba(255, 255, 255, 0.85)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">S. SANKARSHA // GITHUB REPOSITORY</text>
</svg>